name: Float64 dot comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dot-comparison.yml
      - tests/perf/dot/rectangular.mojo
      - tests/perf/dot/dot.mojo
      - tests/perf/dot/compare.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: float64-dot-linux-x86-64
            revision: cabe6f5875f91ec01ede33ac91a4aaaed499a307
            benchmark: dot
          - artifact: rectangular-row-linux-x86-64
            baseline: 15a1b77a299590a915359bb5b872788ea63834a9
            revision: c06d309dbaaaf2e83c548ae868d3172c4b78f58b
            benchmark: rectangular
          - artifact: rectangular-column-linux-x86-64
            baseline: c06d309dbaaaf2e83c548ae868d3172c4b78f58b
            revision: ec76c110b144f53cfa05e6a05e551c35b69bd12e
            benchmark: rectangular
          - artifact: rectangular-reduction-linux-x86-64
            revision: 8bc5f7b43fadb9c90a37f1e4a61740fd48aeb300
            benchmark: rectangular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          locked: true
      - name: Compare archived dot implementations
        env:
          baseline: ${{ matrix.baseline }}
          revision: ${{ matrix.revision }}
          benchmark: ${{ matrix.benchmark }}
        run: |
          args=()
          if [[ "$benchmark" == rectangular ]]; then args+=(--rectangular); fi
          mkdir -p build/dot/{baseline,candidate,results}
          git archive "${baseline:-$revision^}" src | tar -xf - -C build/dot/baseline
          git archive "$revision" src | tar -xf - -C build/dot/candidate
          for edition in baseline candidate; do
            dir=build/dot/$edition
            pixi run mojo build --fp-mode contract=off -I "$dir/src" "tests/perf/dot/$benchmark.mojo" -o "$dir/trial"
          done
          for sample in first repeat; do
            python3 tests/perf/dot/compare.py "${args[@]}" build/dot/{baseline,candidate}/trial "build/dot/results/$sample.csv"
          done
          lscpu > build/dot/results/cpu.txt
          pixi run mojo --version > build/dot/results/mojo.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: build/dot/results/
          if-no-files-found: error
