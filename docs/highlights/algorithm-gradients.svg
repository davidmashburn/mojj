<svg xmlns="http://www.w3.org/2000/svg" width="383" height="322" viewBox="0 0 383 322" role="img">
<title>Train a two-layer network in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Hidden preactivation</text>
<text x="12" y="44" xml:space="preserve">Mojj words    <tspan class="noun">x</tspan> <tspan class="verb">dot</tspan> <tspan class="noun">W</tspan></text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  <tspan class="noun">x</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> <tspan class="noun">W</tspan></text>
<text x="12" y="88" xml:space="preserve">J             <tspan class="noun">x</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> <tspan class="noun">W</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Hidden gradient</text>
<text x="12" y="154" xml:space="preserve">Mojj words    (<tspan class="noun">err</tspan> <tspan class="verb">*</tspan> <tspan class="noun">w</tspan>) <tspan class="verb">*</tspan> (<tspan class="noun">z</tspan> <tspan class="verb">greater</tspan> <tspan class="noun">0</tspan>)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  (<tspan class="noun">err</tspan> <tspan class="verb">*</tspan> <tspan class="noun">w</tspan>) <tspan class="verb">*</tspan> (<tspan class="noun">z</tspan> <tspan class="verb">&gt;</tspan> <tspan class="noun">0</tspan>)</text>
<text x="12" y="198" xml:space="preserve">J             (<tspan class="noun">err</tspan> <tspan class="verb">*</tspan> <tspan class="noun">w</tspan>) <tspan class="verb">*</tspan> (<tspan class="noun">z</tspan> <tspan class="verb">&gt;</tspan> <tspan class="noun">0</tspan>)</text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Input-weight gradient</text>
<text x="12" y="264" xml:space="preserve">Mojj words    <tspan class="noun">x</tspan> <tspan class="verb">times</tspan> <tspan class="modifier">table</tspan> <tspan class="noun">dz</tspan></text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  <tspan class="noun">x</tspan> <tspan class="verb">*</tspan><tspan class="modifier">/</tspan> <tspan class="noun">dz</tspan></text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="noun">x</tspan> <tspan class="verb">*</tspan><tspan class="modifier">/</tspan> <tspan class="noun">dz</tspan></text>
</svg>
