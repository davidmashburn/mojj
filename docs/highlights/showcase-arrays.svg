<svg xmlns="http://www.w3.org/2000/svg" width="586" height="1092" viewBox="0 0 586 1092" role="img">
<title>Build and select arrays in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Build A</text>
<text x="12" y="44" xml:space="preserve">Mojj words    jj["<tspan class="verb">iota</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan>"]()</text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">i.</tspan><tspan class="noun">2</tspan> <tspan class="noun">3</tspan>"]()</text>
<text x="12" y="88" xml:space="preserve">J             <tspan class="verb">i.</tspan><tspan class="noun">2</tspan> <tspan class="noun">3</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Shape of A</text>
<text x="12" y="154" xml:space="preserve">Mojj words    jj["<tspan class="verb">shape</tspan>"](A)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">$</tspan>"](A)</text>
<text x="12" y="198" xml:space="preserve">J             <tspan class="verb">$</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Count rows</text>
<text x="12" y="264" xml:space="preserve">Mojj words    jj["<tspan class="verb">tally</tspan>"](A)</text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">#</tspan>"](A)</text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="verb">#</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="330" xml:space="preserve"></text>
<text x="12" y="352" xml:space="preserve">Flatten A row by row</text>
<text x="12" y="374" xml:space="preserve">Mojj words    jj["<tspan class="verb">ravel</tspan>"](A)</text>
<text x="12" y="396" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">,</tspan>"](A)</text>
<text x="12" y="418" xml:space="preserve">J             <tspan class="verb">,</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="440" xml:space="preserve"></text>
<text x="12" y="462" xml:space="preserve">Transpose A</text>
<text x="12" y="484" xml:space="preserve">Mojj words    jj["<tspan class="verb">transpose</tspan>"](A)</text>
<text x="12" y="506" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">|:</tspan>"](A)</text>
<text x="12" y="528" xml:space="preserve">J             <tspan class="verb">|:</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="550" xml:space="preserve"></text>
<text x="12" y="572" xml:space="preserve">Second row</text>
<text x="12" y="594" xml:space="preserve">Mojj words    jj["<tspan class="verb">gather</tspan>"](jj(1), A)</text>
<text x="12" y="616" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">{</tspan>"](jj(1), A)</text>
<text x="12" y="638" xml:space="preserve">J             <tspan class="noun">1</tspan> <tspan class="verb">{</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="660" xml:space="preserve"></text>
<text x="12" y="682" xml:space="preserve">First two items</text>
<text x="12" y="704" xml:space="preserve">Mojj words    jj["<tspan class="verb">take</tspan>"](jj(2), v)</text>
<text x="12" y="726" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">{.</tspan>"](jj(2), v)</text>
<text x="12" y="748" xml:space="preserve">J             <tspan class="noun">2</tspan> <tspan class="verb">{.</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="770" xml:space="preserve"></text>
<text x="12" y="792" xml:space="preserve">Drop first two items</text>
<text x="12" y="814" xml:space="preserve">Mojj words    jj["<tspan class="verb">drop</tspan>"](jj(2), v)</text>
<text x="12" y="836" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">}.</tspan>"](jj(2), v)</text>
<text x="12" y="858" xml:space="preserve">J             <tspan class="noun">2</tspan> <tspan class="verb">}.</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="880" xml:space="preserve"></text>
<text x="12" y="902" xml:space="preserve">Reverse v</text>
<text x="12" y="924" xml:space="preserve">Mojj words    jj["<tspan class="verb">reverse</tspan>"](v)</text>
<text x="12" y="946" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">|.</tspan>"](v)</text>
<text x="12" y="968" xml:space="preserve">J             <tspan class="verb">|.</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="990" xml:space="preserve"></text>
<text x="12" y="1012" xml:space="preserve">Keep first and third</text>
<text x="12" y="1034" xml:space="preserve">Mojj words    jj["<tspan class="verb">filter</tspan>"](jj([True, False, True, False]), v)</text>
<text x="12" y="1056" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">#</tspan>"](jj([True, False, True, False]), v)</text>
<text x="12" y="1078" xml:space="preserve">J             <tspan class="noun">1</tspan> <tspan class="noun">0</tspan> <tspan class="noun">1</tspan> <tspan class="noun">0</tspan> <tspan class="verb">#</tspan> <tspan class="noun">v</tspan></text>
</svg>
