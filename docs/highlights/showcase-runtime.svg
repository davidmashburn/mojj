<svg xmlns="http://www.w3.org/2000/svg" width="604" height="190" viewBox="0 0 604 190" role="img">
<title>Apply a compiled RMS verb to runtime samples</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">from std.collections import List</text>
<text x="12" y="44" xml:space="preserve">import mojj</text>
<text x="12" y="66" xml:space="preserve"></text>
<text x="12" y="88" xml:space="preserve">def main() raises:</text>
<text x="12" y="110" xml:space="preserve">    comptime RMS = mojj.Expr["<tspan class="verb">sqrt</tspan> <tspan class="modifier">of</tspan> <tspan class="verb">mean</tspan> <tspan class="modifier">of</tspan> <tspan class="verb">square</tspan>"]</text>
<text x="12" y="132" xml:space="preserve">    var samples: List[Float64] = [3.0, 4.0]</text>
<text x="12" y="154" xml:space="preserve">    print(RMS.describe())</text>
<text x="12" y="176" xml:space="preserve">    print(RMS.reduce(samples))  # sqrt((9 + 16) / 2) ≈ 3.535534</text>
</svg>
