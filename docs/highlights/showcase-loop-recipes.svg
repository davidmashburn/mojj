<svg xmlns="http://www.w3.org/2000/svg" width="641" height="322" viewBox="0 0 641 322" role="img">
<title>Replace a loop or callback in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Apply cosine 12 times, starting at x</text>
<text x="12" y="44" xml:space="preserve">Mojj words    jj["<tspan class="verb">cos</tspan> <tspan class="modifier">repeat</tspan> <tspan class="noun">12</tspan>"](x)</text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  jj["(<tspan class="noun">2</tspan><tspan class="modifier">&amp;</tspan><tspan class="verb">o.</tspan>)<tspan class="modifier">^:</tspan><tspan class="noun">12</tspan>"](x)</text>
<text x="12" y="88" xml:space="preserve">J             ((<tspan class="noun">2</tspan><tspan class="modifier">&amp;</tspan><tspan class="verb">o.</tspan>)<tspan class="modifier">^:</tspan><tspan class="noun">12</tspan>) <tspan class="noun">x</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Evaluate the continued fraction with coefficients v</text>
<text x="12" y="154" xml:space="preserve">Mojj words    jj["(<tspan class="verb">plus</tspan> <tspan class="verb">divide</tspan>) <tspan class="modifier">insert</tspan>"](v)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  jj["(<tspan class="verb">+</tspan> <tspan class="verb">%</tspan>)<tspan class="modifier">/</tspan>"](v)</text>
<text x="12" y="198" xml:space="preserve">J             (<tspan class="verb">+</tspan> <tspan class="verb">%</tspan>)<tspan class="modifier">/</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Omit each adjacent pair from v and take the minimum of what remains</text>
<text x="12" y="264" xml:space="preserve">Mojj words    jj["<tspan class="verb">min</tspan> <tspan class="modifier">insert</tspan> <tspan class="modifier">suffix</tspan>"](jj(2), v)</text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">&lt;.</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\\.</tspan>"](jj(2), v)</text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="noun">2</tspan> <tspan class="verb">&lt;.</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\.</tspan> <tspan class="noun">v</tspan></text>
</svg>
