<svg xmlns="http://www.w3.org/2000/svg" width="494" height="124" viewBox="0 0 494 124" role="img">
<title>Run the row-total example as a Mojo program</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">from mojj import jj</text>
<text x="12" y="44" xml:space="preserve"></text>
<text x="12" y="66" xml:space="preserve">def main() raises:</text>
<text x="12" y="88" xml:space="preserve">    var A = jj["<tspan class="verb">i.</tspan><tspan class="noun">2</tspan> <tspan class="noun">3</tspan>"]()</text>
<text x="12" y="110" xml:space="preserve">    print(jj["<tspan class="verb">sum</tspan> <tspan class="modifier">rank</tspan> <tspan class="noun">1</tspan>"](A).as_ints())  # [3, 12]</text>
</svg>
