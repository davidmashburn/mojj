<svg xmlns="http://www.w3.org/2000/svg" width="604" height="190" viewBox="0 0 604 190" role="img">
<title>Apply a signal filter in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Mojj words    <tspan class="noun">windows</tspan> =: (<tspan class="verb">tally</tspan> <tspan class="noun">taps</tspan>) (<tspan class="verb">identity</tspan> <tspan class="modifier">prefix</tspan>) <tspan class="noun">samples</tspan></text>
<text x="12" y="44" xml:space="preserve">Mojj words    <tspan class="noun">filtered</tspan> =: <tspan class="noun">windows</tspan> <tspan class="verb">dot</tspan> (<tspan class="verb">reverse</tspan> <tspan class="noun">taps</tspan>)</text>
<text x="12" y="66" xml:space="preserve"></text>
<text x="12" y="88" xml:space="preserve">Mojj symbols  <tspan class="noun">windows</tspan> =: (<tspan class="verb">#</tspan> <tspan class="noun">taps</tspan>) <tspan class="verb">]</tspan><tspan class="modifier">\</tspan> <tspan class="noun">samples</tspan></text>
<text x="12" y="110" xml:space="preserve">Mojj symbols  <tspan class="noun">filtered</tspan> =: <tspan class="noun">windows</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> (<tspan class="verb">|.</tspan> <tspan class="noun">taps</tspan>)</text>
<text x="12" y="132" xml:space="preserve"></text>
<text x="12" y="154" xml:space="preserve">J             <tspan class="noun">windows</tspan> =: (<tspan class="verb">#</tspan> <tspan class="noun">taps</tspan>) <tspan class="verb">]</tspan><tspan class="modifier">\</tspan> <tspan class="noun">samples</tspan></text>
<text x="12" y="176" xml:space="preserve">J             <tspan class="noun">filtered</tspan> =: <tspan class="noun">windows</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> (<tspan class="verb">|.</tspan> <tspan class="noun">taps</tspan>)</text>
</svg>
