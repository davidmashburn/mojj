<svg xmlns="http://www.w3.org/2000/svg" width="503" height="58" viewBox="0 0 503 58" role="img">
<title>Compare column totals with row totals</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">print(jj["<tspan class="verb">sum</tspan>"](batches).as_ints())         # [4, 6]</text>
<text x="12" y="44" xml:space="preserve">print(jj["<tspan class="verb">sum</tspan> <tspan class="modifier">rank</tspan> <tspan class="noun">1</tspan>"](batches).as_ints())  # [3, 7]</text>
</svg>
