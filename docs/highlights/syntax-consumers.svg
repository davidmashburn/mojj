<svg xmlns="http://www.w3.org/2000/svg" width="521" height="124" viewBox="0 0 521 124" role="img">
<title>Define compiled verbs and evaluate a compiled sentence</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">from mojj import Expr, Noun</text>
<text x="12" y="44" xml:space="preserve"></text>
<text x="12" y="66" xml:space="preserve">var hook = Expr["<tspan class="verb">minus</tspan> <tspan class="verb">square</tspan>"].monad(Noun(3))</text>
<text x="12" y="88" xml:space="preserve">var difference = Expr["<tspan class="verb">minus</tspan>"].dyad(Noun(10), Noun(3))</text>
<text x="12" y="110" xml:space="preserve">var sentence = Expr["<tspan class="noun">10</tspan> <tspan class="verb">divide</tspan> <tspan class="noun">3</tspan> <tspan class="verb">plus</tspan> <tspan class="noun">2</tspan>"].value()</text>
</svg>
