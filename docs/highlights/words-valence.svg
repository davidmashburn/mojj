<svg xmlns="http://www.w3.org/2000/svg" width="448" height="80" viewBox="0 0 448 80" role="img">
<title>Apply Mojj phrases with zero, one, or two arguments</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">print(jj["<tspan class="noun">10</tspan> <tspan class="verb">-</tspan> <tspan class="noun">3</tspan>"]().as_int())             # 7</text>
<text x="12" y="44" xml:space="preserve">print(jj["<tspan class="verb">square</tspan>"](jj(3)).as_int())        # 9</text>
<text x="12" y="66" xml:space="preserve">print(jj["<tspan class="verb">-</tspan>"](jj(10), jj(3)).as_int())     # 7</text>
</svg>
