<svg xmlns="http://www.w3.org/2000/svg" width="687" height="80" viewBox="0 0 687 80" role="img">
<title>Divide and group arithmetic expressions</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">print(jj["<tspan class="verb">divide</tspan>"](readings, jj(2)).as_floats())  # [0.5, 1.0, 1.5, 2.0]</text>
<text x="12" y="44" xml:space="preserve">print(jj["<tspan class="noun">2</tspan> <tspan class="verb">*</tspan> <tspan class="noun">3</tspan> <tspan class="verb">+</tspan> <tspan class="noun">4</tspan>"]().as_int())                 # 14</text>
<text x="12" y="66" xml:space="preserve">print(jj["(<tspan class="noun">2</tspan> <tspan class="verb">*</tspan> <tspan class="noun">3</tspan>) <tspan class="verb">+</tspan> <tspan class="noun">4</tspan>"]().as_int())               # 10</text>
</svg>
