<svg xmlns="http://www.w3.org/2000/svg" width="429" height="762" viewBox="0 0 429 762" role="img">
<title>Reduce and combine in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Sum a vector</text>
<text x="12" y="44" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan>"](v)</text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan>"](v)</text>
<text x="12" y="88" xml:space="preserve">J             <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Mean of a vector</text>
<text x="12" y="154" xml:space="preserve">Mojj words    jj["<tspan class="verb">mean</tspan>"](v)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="verb">%</tspan> <tspan class="verb">#</tspan>"](v)</text>
<text x="12" y="198" xml:space="preserve">J             (<tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="verb">%</tspan> <tspan class="verb">#</tspan>) <tspan class="noun">v</tspan></text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Column totals</text>
<text x="12" y="264" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan>"](A)</text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan>"](A)</text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="noun">A</tspan></text>
<text x="12" y="330" xml:space="preserve"></text>
<text x="12" y="352" xml:space="preserve">Row totals</text>
<text x="12" y="374" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan> <tspan class="modifier">rank</tspan> <tspan class="noun">1</tspan>"](A)</text>
<text x="12" y="396" xml:space="preserve">Mojj symbols  jj['<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">"</tspan><tspan class="noun">1</tspan>'](A)</text>
<text x="12" y="418" xml:space="preserve">J             (<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">"</tspan><tspan class="noun">1</tspan>) <tspan class="noun">A</tspan></text>
<text x="12" y="440" xml:space="preserve"></text>
<text x="12" y="462" xml:space="preserve">All pairwise products</text>
<text x="12" y="484" xml:space="preserve">Mojj words    jj["<tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">times</tspan> <tspan class="modifier">table</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan>"]()</text>
<text x="12" y="506" xml:space="preserve">Mojj symbols  jj["<tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">*</tspan><tspan class="modifier">/</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan>"]()</text>
<text x="12" y="528" xml:space="preserve">J             <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">*</tspan><tspan class="modifier">/</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan></text>
<text x="12" y="550" xml:space="preserve"></text>
<text x="12" y="572" xml:space="preserve">Inner product</text>
<text x="12" y="594" xml:space="preserve">Mojj words    jj["<tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">dot</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan>"]()</text>
<text x="12" y="616" xml:space="preserve">Mojj symbols  jj["<tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan>"]()</text>
<text x="12" y="638" xml:space="preserve">J             <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> <tspan class="noun">4</tspan> <tspan class="noun">5</tspan> <tspan class="noun">6</tspan></text>
<text x="12" y="660" xml:space="preserve"></text>
<text x="12" y="682" xml:space="preserve">Matrix times vector</text>
<text x="12" y="704" xml:space="preserve">Mojj words    jj["<tspan class="verb">dot</tspan>"](A, jj([1, 2, 3]))</text>
<text x="12" y="726" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan>"](A, jj([1, 2, 3]))</text>
<text x="12" y="748" xml:space="preserve">J             <tspan class="noun">A</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan> <tspan class="modifier">.</tspan> <tspan class="verb">*</tspan> <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan></text>
</svg>
