<svg xmlns="http://www.w3.org/2000/svg" width="448" height="432" viewBox="0 0 448 432" role="img">
<title>Windows and blocks in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Running totals → 1, 3, 6, 10</text>
<text x="12" y="44" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](v)</text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\\</tspan>"](v)</text>
<text x="12" y="88" xml:space="preserve">J             <tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Totals from each item to the end → 10, 9, 7, 4</text>
<text x="12" y="154" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan> <tspan class="modifier">suffix</tspan>"](v)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\\.</tspan>"](v)</text>
<text x="12" y="198" xml:space="preserve">J             <tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\.</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Sliding pair sums → 3, 5, 7</text>
<text x="12" y="264" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](jj(2), v)</text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\\</tspan>"](jj(2), v)</text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="noun">2</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="330" xml:space="preserve"></text>
<text x="12" y="352" xml:space="preserve">Disjoint pair sums → 3, 7</text>
<text x="12" y="374" xml:space="preserve">Mojj words    jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](jj(-2), v)</text>
<text x="12" y="396" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\\</tspan>"](jj(-2), v)</text>
<text x="12" y="418" xml:space="preserve">J             <tspan class="noun">_2</tspan> <tspan class="verb">+</tspan><tspan class="modifier">/</tspan><tspan class="modifier">\</tspan> <tspan class="noun">v</tspan></text>
</svg>
