<svg xmlns="http://www.w3.org/2000/svg" width="190" height="80" viewBox="0 0 190 80" role="img">
<title>Calculate prefix sums at the Mojj prompt</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">mojj&gt; <tspan class="noun">v</tspan> =: <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="noun">4</tspan></text>
<text x="12" y="44" xml:space="preserve">mojj&gt; <tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="66" xml:space="preserve">[1, 3, 6, 10]</text>
</svg>
