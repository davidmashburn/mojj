<svg xmlns="http://www.w3.org/2000/svg" width="475" height="146" viewBox="0 0 475 146" role="img">
<title>Filter samples using windows and reversed taps</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve"><tspan class="noun">samples</tspan> =: <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">4</tspan> <tspan class="noun">8</tspan> <tspan class="noun">16</tspan></text>
<text x="12" y="44" xml:space="preserve"><tspan class="noun">taps</tspan> =: <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan></text>
<text x="12" y="66" xml:space="preserve"><tspan class="noun">windows</tspan> =: (<tspan class="verb">tally</tspan> <tspan class="noun">taps</tspan>) (<tspan class="verb">identity</tspan> <tspan class="modifier">prefix</tspan>) <tspan class="noun">samples</tspan></text>
<text x="12" y="88" xml:space="preserve"><tspan class="noun">windows</tspan></text>
<text x="12" y="110" xml:space="preserve"><tspan class="noun">filtered</tspan> =: <tspan class="noun">windows</tspan> <tspan class="verb">dot</tspan> (<tspan class="verb">reverse</tspan> <tspan class="noun">taps</tspan>)</text>
<text x="12" y="132" xml:space="preserve"><tspan class="noun">filtered</tspan></text>
</svg>
