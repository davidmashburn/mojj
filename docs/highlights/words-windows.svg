<svg xmlns="http://www.w3.org/2000/svg" width="650" height="80" viewBox="0 0 650 80" role="img">
<title>Sum prefixes, sliding windows, and disjoint blocks</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">print(jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](readings).as_ints())          # [1, 3, 6, 10]</text>
<text x="12" y="44" xml:space="preserve">print(jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](jj(2), readings).as_ints())   # [3, 5, 7]</text>
<text x="12" y="66" xml:space="preserve">print(jj["<tspan class="verb">sum</tspan> <tspan class="modifier">prefix</tspan>"](jj(-2), readings).as_ints())  # [3, 7]</text>
</svg>
