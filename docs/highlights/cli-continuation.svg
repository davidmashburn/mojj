<svg xmlns="http://www.w3.org/2000/svg" width="291" height="146" viewBox="0 0 291 146" role="img">
<title>Continue a sentence and sum each row</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">mojj&gt; <tspan class="noun">batches</tspan> =: (<tspan class="noun">2</tspan> <tspan class="noun">2</tspan> <tspan class="verb">reshape</tspan></text>
<text x="12" y="44" xml:space="preserve">... <tspan class="noun">doubled</tspan>)</text>
<text x="12" y="66" xml:space="preserve">mojj&gt; <tspan class="noun">batches</tspan></text>
<text x="12" y="88" xml:space="preserve">shape [2, 2] [2, 4, 6, 8]</text>
<text x="12" y="110" xml:space="preserve">mojj&gt; <tspan class="verb">sum</tspan> <tspan class="modifier">rank</tspan> <tspan class="noun">1</tspan> <tspan class="noun">batches</tspan></text>
<text x="12" y="132" xml:space="preserve">[6, 14]</text>
</svg>
