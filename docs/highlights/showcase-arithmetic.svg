<svg xmlns="http://www.w3.org/2000/svg" width="402" height="652" viewBox="0 0 402 652" role="img">
<title>Calculate and compare in Mojj and J</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">Square each item</text>
<text x="12" y="44" xml:space="preserve">Mojj words    jj["<tspan class="verb">square</tspan>"](v)</text>
<text x="12" y="66" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">*:</tspan>"](v)</text>
<text x="12" y="88" xml:space="preserve">J             <tspan class="verb">*:</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="110" xml:space="preserve"></text>
<text x="12" y="132" xml:space="preserve">Double each item</text>
<text x="12" y="154" xml:space="preserve">Mojj words    jj["<tspan class="verb">double</tspan>"](v)</text>
<text x="12" y="176" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+:</tspan>"](v)</text>
<text x="12" y="198" xml:space="preserve">J             <tspan class="verb">+:</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="220" xml:space="preserve"></text>
<text x="12" y="242" xml:space="preserve">Divide each item by 2</text>
<text x="12" y="264" xml:space="preserve">Mojj words    jj["<tspan class="verb">divide</tspan>"](v, jj(2))</text>
<text x="12" y="286" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">%</tspan>"](v, jj(2))</text>
<text x="12" y="308" xml:space="preserve">J             <tspan class="noun">v</tspan> <tspan class="verb">%</tspan> <tspan class="noun">2</tspan></text>
<text x="12" y="330" xml:space="preserve"></text>
<text x="12" y="352" xml:space="preserve">Remainders modulo 3</text>
<text x="12" y="374" xml:space="preserve">Mojj words    jj["<tspan class="verb">residue</tspan>"](jj(3), v)</text>
<text x="12" y="396" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">|</tspan>"](jj(3), v)</text>
<text x="12" y="418" xml:space="preserve">J             <tspan class="noun">3</tspan> <tspan class="verb">|</tspan> <tspan class="noun">v</tspan></text>
<text x="12" y="440" xml:space="preserve"></text>
<text x="12" y="462" xml:space="preserve">Elementwise threshold</text>
<text x="12" y="484" xml:space="preserve">Mojj words    jj["<tspan class="verb">greater</tspan>"](v, jj(2))</text>
<text x="12" y="506" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">&gt;</tspan>"](v, jj(2))</text>
<text x="12" y="528" xml:space="preserve">J             <tspan class="noun">v</tspan> <tspan class="verb">&gt;</tspan> <tspan class="noun">2</tspan></text>
<text x="12" y="550" xml:space="preserve"></text>
<text x="12" y="572" xml:space="preserve">Add 10 to row one and 20 to row two</text>
<text x="12" y="594" xml:space="preserve">Mojj words    jj["<tspan class="verb">plus</tspan>"](jj([10, 20]), A)</text>
<text x="12" y="616" xml:space="preserve">Mojj symbols  jj["<tspan class="verb">+</tspan>"](jj([10, 20]), A)</text>
<text x="12" y="638" xml:space="preserve">J             <tspan class="noun">10</tspan> <tspan class="noun">20</tspan> <tspan class="verb">+</tspan> <tspan class="noun">A</tspan></text>
</svg>
