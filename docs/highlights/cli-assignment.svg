<svg xmlns="http://www.w3.org/2000/svg" width="310" height="212" viewBox="0 0 310 212" role="img">
<title>Assign, update, and read names in a Mojj session</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">mojj&gt; <tspan class="noun">readings</tspan> =: <tspan class="noun">1</tspan> <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="noun">4</tspan></text>
<text x="12" y="44" xml:space="preserve">mojj&gt; <tspan class="noun">doubled</tspan> =: <tspan class="noun">2</tspan> <tspan class="verb">*</tspan> <tspan class="noun">readings</tspan></text>
<text x="12" y="66" xml:space="preserve">mojj&gt; <tspan class="verb">sum</tspan> <tspan class="noun">doubled</tspan></text>
<text x="12" y="88" xml:space="preserve">20</text>
<text x="12" y="110" xml:space="preserve">mojj&gt; <tspan class="noun">readings</tspan> =: <tspan class="noun">readings</tspan> <tspan class="verb">+</tspan> <tspan class="noun">10</tspan></text>
<text x="12" y="132" xml:space="preserve">mojj&gt; <tspan class="noun">readings</tspan></text>
<text x="12" y="154" xml:space="preserve">[11, 12, 13, 14]</text>
<text x="12" y="176" xml:space="preserve">mojj&gt; <tspan class="noun">doubled</tspan></text>
<text x="12" y="198" xml:space="preserve">[2, 4, 6, 8]</text>
</svg>
