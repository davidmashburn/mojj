<svg xmlns="http://www.w3.org/2000/svg" width="705" height="80" viewBox="0 0 705 80" role="img">
<title>Compose root mean square from three verbs</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve">print(jj["<tspan class="verb">square</tspan>"](readings).as_ints())                 # [1, 4, 9, 16]</text>
<text x="12" y="44" xml:space="preserve">print(jj["<tspan class="verb">mean</tspan> <tspan class="modifier">of</tspan> <tspan class="verb">square</tspan>"](readings).as_float())        # 7.5</text>
<text x="12" y="66" xml:space="preserve">print(jj["<tspan class="verb">sqrt</tspan> <tspan class="modifier">of</tspan> <tspan class="verb">mean</tspan> <tspan class="modifier">of</tspan> <tspan class="verb">square</tspan>"](readings).as_float())  # about 2.738613</text>
</svg>
