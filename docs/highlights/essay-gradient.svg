<svg xmlns="http://www.w3.org/2000/svg" width="448" height="256" viewBox="0 0 448 256" role="img">
<title>Form the input-weight gradient for leaky ReLU</title>
<style>svg { background: #f6f8fa; color: #24292f; }
text { fill: currentColor; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
.verb { fill: #006679; font-weight: bold; }
.noun { fill: #176337; }
.modifier { fill: #922477; text-decoration: underline; }
@media (prefers-color-scheme: dark) {
  svg { background: #171c22; color: #e6edf3; }
  .verb { fill: #80def0; } .noun { fill: #9be4aa; } .modifier { fill: #f2b4e4; }
}</style>
<text x="12" y="22" xml:space="preserve"><tspan class="noun">x</tspan> =: <tspan class="noun">1</tspan> <tspan class="noun">2</tspan></text>
<text x="12" y="44" xml:space="preserve"><tspan class="noun">W</tspan> =: <tspan class="noun">2</tspan> <tspan class="noun">3</tspan> <tspan class="verb">reshape</tspan> <tspan class="noun">1</tspan> <tspan class="noun">_1</tspan> <tspan class="noun">0.5</tspan> <tspan class="noun">0</tspan> <tspan class="noun">0.25</tspan> <tspan class="noun">0.5</tspan></text>
<text x="12" y="66" xml:space="preserve"><tspan class="noun">w</tspan> =: <tspan class="noun">0.5</tspan> <tspan class="noun">1</tspan> <tspan class="noun">_1</tspan></text>
<text x="12" y="88" xml:space="preserve"><tspan class="noun">target</tspan> =: <tspan class="noun">1.0</tspan></text>
<text x="12" y="110" xml:space="preserve"><tspan class="noun">alpha</tspan> =: <tspan class="noun">0.1</tspan></text>
<text x="12" y="132" xml:space="preserve"><tspan class="noun">z</tspan> =: <tspan class="noun">x</tspan> <tspan class="verb">dot</tspan> <tspan class="noun">W</tspan></text>
<text x="12" y="154" xml:space="preserve"><tspan class="noun">h</tspan> =: <tspan class="noun">z</tspan> <tspan class="verb">max</tspan> (<tspan class="noun">alpha</tspan> <tspan class="verb">*</tspan> <tspan class="noun">z</tspan>)</text>
<text x="12" y="176" xml:space="preserve"><tspan class="noun">err</tspan> =: (<tspan class="noun">h</tspan> <tspan class="verb">dot</tspan> <tspan class="noun">w</tspan>) <tspan class="verb">-</tspan> <tspan class="noun">target</tspan></text>
<text x="12" y="198" xml:space="preserve"><tspan class="noun">slope</tspan> =: <tspan class="noun">alpha</tspan> <tspan class="verb">+</tspan> ((<tspan class="noun">1</tspan> <tspan class="verb">-</tspan> <tspan class="noun">alpha</tspan>) <tspan class="verb">*</tspan> (<tspan class="noun">z</tspan> <tspan class="verb">greater</tspan> <tspan class="noun">0</tspan>))</text>
<text x="12" y="220" xml:space="preserve"><tspan class="noun">dz</tspan> =: (<tspan class="noun">err</tspan> <tspan class="verb">*</tspan> <tspan class="noun">w</tspan>) <tspan class="verb">*</tspan> <tspan class="noun">slope</tspan></text>
<text x="12" y="242" xml:space="preserve"><tspan class="noun">x</tspan> <tspan class="verb">times</tspan> <tspan class="modifier">table</tspan> <tspan class="noun">dz</tspan></text>
</svg>
