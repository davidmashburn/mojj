[workspace]
name = "mojj"
version = "0.1.0"
description = "Inspectable numerical composition in Mojo"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
mojo = "==1.1.0"
python = ">=3.11,<4"

[tasks]
compare-j = "python3 tests/reference/compare.py"
test-reference-harness = "python3 -m unittest discover -s tests/reference -p 'test_*.py'"
perf-probes = "sh tests/perf/run-probes.sh"
test = { depends-on = ["test-core", "test-verbs", "test-vocabulary", "test-strings", "test-syntax", "test-reference-harness"] }
test-vocabulary = { depends-on = ["test-circle", "test-predicates", "test-real-verbs", "test-p2-expr", "test-shapes", "test-arrays", "test-array-modifiers", "test-p3-expr"] }
test-circle = "mojo run --fp-mode contract=off -I src tests/test_circle.mojo"
test-predicates = "mojo run --fp-mode contract=off -I src tests/test_predicates.mojo"
test-real-verbs = "mojo run --fp-mode contract=off -I src tests/test_real_verbs.mojo"
test-p2-expr = "mojo run --fp-mode contract=off -I src tests/test_p2_expr.mojo"
test-shapes = "mojo run --fp-mode contract=off -I src tests/test_shapes.mojo"
test-arrays = "mojo run --fp-mode contract=off -I src tests/test_arrays.mojo"
test-array-modifiers = "mojo run --fp-mode contract=off -I src tests/test_array_modifiers.mojo"
test-p3-expr = "mojo run --fp-mode contract=off -I src tests/test_p3_expr.mojo"
test-verbs = "mojo run --fp-mode contract=off -I src tests/test_verbs.mojo"
test-core = "mojo run --fp-mode contract=off -I src tests/test_core.mojo"
test-strings = "mojo run --fp-mode contract=off -I src tests/test_strings.mojo"
test-syntax = "python3 tests/check_syntax.py"
demo = "mojo run --fp-mode contract=off -I src examples/rms.mojo"
strings-demo = "mojo run --fp-mode contract=off -I src examples/strings.mojo"
package = "mkdir -p build && mojo precompile src/mojj -o build/mojj.mojoc"
package-smoke = { depends-on = ["package-core-smoke", "package-strings-smoke"] }
package-core-smoke = { cmd = "mojo run --fp-mode contract=off -I build examples/rms.mojo", depends-on = ["package"] }
package-strings-smoke = { cmd = "mojo run --fp-mode contract=off -I build tests/test_strings.mojo && mojo run --fp-mode contract=off -I build tests/test_p2_expr.mojo && mojo run --fp-mode contract=off -I build tests/test_p3_expr.mojo", depends-on = ["package"] }
